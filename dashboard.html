                        <div style="font-size:10.5px;font-family:var(--font-mono);color:var(--muted);margin-top:2px;">${rate}% failure</div>
                      </td>
                      <td style="font-size:11px;font-family:var(--font-mono);white-space:nowrap;">
                        <span class="tag-status ok">${fmt(e.ok || 0)} OK</span>
                        ${e.r4 ? `<span class="tag-status warn" style="margin-left:4px;">${fmt(e.r4)} 4xx</span>` : ''}
                        ${e.r5 ? `<span class="tag-status bad" style="margin-left:4px;">${fmt(e.r5)} 5xx</span>` : ''}
                        ${e.limited ? `<span class="tag-status muted" style="margin-left:4px;">${fmt(e.limited)} limit</span>` : ''}

                      </td>

                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderRetentionMatrix(retention) {
        const all = Array.isArray(retention) ? retention : [];
        if (!all.length) return `<div style="color:var(--muted);font-size:12px;padding:12px 0;">No cohort telemetry recorded yet.</div>`;
        const rows = (state.retExpanded ? all.slice() : all.slice(-14)).reverse();

        function heatClass(val) {
          if (val === undefined || val === null) return "empty";
          if (val === 0) return "lvl-0";
          if (val <= 15) return "lvl-1";
          if (val <= 30) return "lvl-2";
          if (val <= 45) return "lvl-3";
          return "lvl-4";
        }

        const cellTip = (val, size) => val !== undefined
          ? `${Math.round(size * (val / 100))} of ${fmt(size)} devices (${val}%)`
          : "Milestone not reached yet";

        const heatCell = (val, size) => `
          <td style="text-align:center;">

          </td>

        let d1Total = 0, d1Count = 0;
        let d7Total = 0, d7Count = 0;
        let d30Total = 0, d30Count = 0;
        let totalSize = 0;

        rows.forEach(r => {
          totalSize += r.size || 0;

          if (typeof r.d7 === "number") { d7Total += r.d7 * r.size; d7Count += r.size; }
          if (typeof r.d30 === "number") { d30Total += r.d30 * r.size; d30Count += r.size; }

        const avgD1 = d1Count > 0 ? Math.round(d1Total / d1Count) : null;

        const avgD30 = d30Count > 0 ? Math.round(d30Total / d30Count) : null;

        const showMoreBtn = retention.length > 14
          ? `<div style="margin-top:16px;text-align:center;">

        return `
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>

                  <th style="text-align:center;width:20%;">Day 1</th>

                  </td>
                  <td style="text-align:center;padding:10px 12px;">
                    <span class="heat-box ${heatClass(avgD7)}" title="${avgD7 !== null ? avgD7 + '% aggregate across ' + fmt(d7Count) + ' installs' : ''}">${avgD7 !== null ? avgD7 + '%' : '—'}</span>

      }

      /* ================= RESPONSIVE SVG CHART ================= */
      function drawChart(d) {
        const svgEl = document.getElementById("mainChart");
        const wrap = document.getElementById("chartWrap");
        if (!svgEl || !wrap) return;

        const series = Array.isArray(d.dauSeries) ? d.dauSeries : [];
        if (!series.length) {
          svgEl.innerHTML = "";
          svgEl.style.height = "60px";
          return;
        }

        const width = Math.max(320, wrap.clientWidth);
        const height = 260;
        const padL = 40, padR = 12, padT = 16, padB = 24;
        const plotW = width - padL - padR;
        const plotH = height - padT - padB;
        const yBottom = padT + plotH;
        const n = series.length;
        const maxVal = Math.max(1, ...series.map(p => p.dau || 0));
        
        function niceStep(val) {
          if (val <= 0) return 100;
          const raw = val / 4;
          const p = Math.pow(10, Math.floor(Math.log10(raw)));
          const f = raw / p;
          let nf = 10;
          if (f <= 1.25) nf = 1;
          else if (f <= 2.5) nf = 2;
          else if (f <= 5) nf = 5;
          return nf * p;
        }

        const step = niceStep(maxVal);
        const yMax = Math.max(step * 4, Math.ceil((maxVal * 1.05) / step) * step);
        const slot = plotW / n;
        const barW = Math.max(2, Math.min(22, slot * 0.65));
        const y = v => padT + plotH - (v / yMax) * plotH;

        let inner = "";

        const tickCount = Math.round(yMax / step);
        for (let i = 0; i <= tickCount; i++) {
          const gv = step * i;
          const gy = y(gv).toFixed(1);
          inner += `
            <line x1="${padL}" y1="${gy}" x2="${width - padR}" y2="${gy}" stroke="var(--border-subtle)" stroke-width="1"/>
            <text x="${padL - 8}" y="${(Number(gy) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--font-mono)">${fmt(gv)}</text>
          `;
        }

        series.forEach((p, i) => {
          const dau = p.dau || 0;
          if (dau <= 0) return;
          const cx = padL + slot * i + slot / 2;
          const x0 = cx - barW / 2;
          const totalH = (dau / yMax) * plotH;
          const newH = state.chartSplit ? ((p.new || 0) / yMax) * plotH : 0;
          const retH = totalH - newH;
          const yTop = yBottom - totalH;
          const isPeak = dau === maxVal;

          const retFill = state.chartSplit ? "var(--bar-ret)" : "var(--accent)";
          inner += `<rect id="bar-ret-${i}" x="${x0.toFixed(1)}" y="${(yTop + newH).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(retH, 1.5).toFixed(1)}" fill="${retFill}" rx="1"${isPeak ? ' stroke="var(--trend)" stroke-width="1.2"' : ''}/>`;

          if (state.chartSplit && newH > 0.5) {
            inner += `<rect id="bar-new-${i}" x="${x0.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${newH.toFixed(1)}" fill="var(--accent)" rx="1"/>`;
          }
        });

        const trendPts = [];
        if (state.chartTrend && n >= 4) {
          const pts = [];
          let runningSum = 0;
          for (let i = 0; i < n; i++) {
            runningSum += series[i].dau || 0;
            if (i >= 7) runningSum -= series[i - 7].dau || 0;
            const winLen = Math.min(i + 1, 7);
            const avg = runningSum / winLen;
            if (avg > 0) {
              pts.push(`${(padL + slot * i + slot / 2).toFixed(1)},${y(avg).toFixed(1)}`);
              trendPts[i] = y(avg);
            }
          }
          if (pts.length) {
            inner += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--trend)" stroke-width="1.8" stroke-linejoin="round" opacity="0.9"/>`;
          }
        }

        series.forEach((p, i) => {
          inner += `<rect x="${(padL + slot * i).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${plotH}" fill="transparent" data-i="${i}"/>`;
        });

        inner += `<line x1="0" y1="${padT}" x2="0" y2="${yBottom}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity="0" id="crosshair"/>`;
        inner += `<circle cx="0" cy="0" r="3.5" fill="var(--trend)" stroke="var(--bg)" stroke-width="1.5" opacity="0" id="crossDot"/>`;

        svgEl.innerHTML = inner;
        svgEl.setAttribute("width", width);
        svgEl.setAttribute("height", height);
        svgEl.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svgEl.style.height = height + "px";

        const metaBar = document.getElementById("chartMetaBar");
        if (metaBar) {
          const tickIndices = n <= 7
            ? series.map((_, idx) => idx)
            : [0, Math.floor(n * 0.25), Math.floor(n * 0.5), Math.floor(n * 0.75), n - 1];
          const uniqueIndices = [...new Set(tickIndices)].filter(idx => idx >= 0 && idx < n);
          metaBar.innerHTML = uniqueIndices.map(idx => `<span>${dayLabel(series[idx].date)}</span>`).join("");
        }

        const tip = document.getElementById("chartTip");
        const cross = document.getElementById("crosshair");
        const crossDot = document.getElementById("crossDot");

        svgEl.querySelectorAll("rect[data-i]").forEach(r => {
          r.addEventListener("mouseenter", () => {
            const idx = Number(r.dataset.i);
            const p = series[idx];
            const newPct = p.dau > 0 ? Math.round(((p.new || 0) / p.dau) * 100) : 0;

            tip.innerHTML = `
              <div class="tooltip-title">${dayLabel(p.date, true)} · ${p.date}</div>
              <div class="tooltip-row"><span>Active devices</span><b>${fmt(p.dau || 0)}</b></div>
              <div class="tooltip-row"><span><span style="display:inline-block;width:6px;height:6px;border-radius:1px;background:var(--bar-ret);margin-right:6px;"></span>Returning</span><b>${fmt(p.returning || 0)}</b></div>
              <div class="tooltip-row"><span><span style="display:inline-block;width:6px;height:6px;border-radius:1px;background:var(--accent);margin-right:6px;"></span>New installs</span><b>${fmt(p.new || 0)} (${newPct}%)</b></div>
            `;
            tip.classList.add("show");

            const xPos = padL + slot * idx + slot / 2;
            cross.setAttribute("x1", xPos);
            cross.setAttribute("x2", xPos);
            cross.style.opacity = "0.4";

            if (trendPts[idx] !== undefined && crossDot) {
              crossDot.setAttribute("cx", xPos);
              crossDot.setAttribute("cy", trendPts[idx]);
              crossDot.style.opacity = "1";
            }

            const wrapBox = wrap.getBoundingClientRect();
            const tipW = tip.offsetWidth || 170;
            let tx = xPos + 12;
            if (tx + tipW > wrapBox.width - 8) tx = xPos - tipW - 12;
            tip.style.left = Math.max(4, tx) + "px";
            tip.style.top = Math.max(4, padT) + "px";
          });

          r.addEventListener("mouseleave", () => {
            tip.classList.remove("show");
            cross.style.opacity = "0";
            if (crossDot) crossDot.style.opacity = "0";
          });
        });
      }

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (state.lastData && state.activeTab === "overview") drawChart(state.lastData);
        }, 100);
      });

      /* ================= CSV & JSON Exports ================= */
      function downloadFile(name, type, content) {
        const blob = new Blob([content], { type });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
      }

      function exportCsv() {
        const d = state.lastData;
        if (!d || !Array.isArray(d.dauSeries)) return;
        const lines = ["date,dau,new,returning"];
        for (const p of d.dauSeries) lines.push(`${p.date},${p.dau},${p.new},${p.returning}`);
        downloadFile(`xtra-dau-${d.currentMonth || 'data'}.csv`, "text/csv", lines.join("\n"));
      }

      async function copyJson() {
        if (!state.lastData) return;
        try {
          await navigator.clipboard.writeText(JSON.stringify(state.lastData, null, 2));
          setStatus("ok", "JSON copied");
        } catch {
          exportCsv();
        }
      }

      /* ================= DEMO GENERATOR ================= */
      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function renderDemo() {
        const rnd = mulberry32(0x53fc18);
        const days = Number(rangeSelect.value);
        const now = new Date();
        const series = [];

        for (let i = days - 1; i >= 0; i--) {
          const d = new Date(now.getTime() - i * 86400000);
          const dow = d.getUTCDay();
          const trend = 1050 + (days - i) * 6.5;
          const weekly = (dow === 0 || dow === 6) ? 1.2 : dow === 5 ? 1.14 : 1.0;
          const dau = Math.round(trend * weekly * (0.94 + rnd() * 0.12));
          const spike = rnd() > 0.92 ? Math.round(80 + rnd() * 150) : 0;
